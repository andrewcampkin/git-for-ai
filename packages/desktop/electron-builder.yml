# electron-builder config — checked in ahead of use (DESKTOP.md §5 step 5 is packaging;
# this session only ships `start` from source). NOT exercised yet: no installer is built
# until the owner has used the app in anger.
#
# NAMING: "git-for-ai" is the internal/working name only (DESKTOP.md preamble). appId and
# productName are PLACEHOLDERS to be replaced when the public product name is decided —
# before any public artifact ships.
appId: dev.git-for-ai.desktop.placeholder
productName: git-for-ai
directories:
  output: release
files:
  - dist/**
  - package.json
win:
  target: nsis
# Nothing native to rebuild (the app is plain Node + the CLI's server); skip the step.
npmRebuild: false
